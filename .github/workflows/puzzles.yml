name: puzzles

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '860e267e26cbf52bdca301d114b3c203' }}
  PUZZLE_SEED: ${{ secrets.PUZZLE_SEED }}
  KV_NAMESPACE: 3f3a19381382454f8c1df5c71f9167b4

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - name: Require the puzzle seed
        run: |
          if [[ -z "$PUZZLE_SEED" ]]; then
            echo "::error::the PUZZLE_SEED secret is empty; set it before this job can generate puzzles"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the generator
        run: cargo build --release
        working-directory: tools/gen
      - name: Generate yesterday through 15 days ahead
        run: |
          first=2026-11-08
          start=$(date -u -d yesterday +%F)
          if [[ "$start" < "$first" ]]; then start=$first; fi
          end=$(date -u -d '+15 days' +%F)
          days=$(( ($(date -u -d "$end" +%s) - $(date -u -d "$start" +%s)) / 86400 + 1 ))
          tools/gen/target/release/checksum-gen range "$start" "$days" > range.json
          echo "generated $days puzzles from $start"
      - name: Drop keys already in KV
        run: |
          npx wrangler kv key list --namespace-id "$KV_NAMESPACE" --remote > existing.json
          jq --slurpfile have existing.json \
            '($have[0] | map(.name)) as $names | map(select(.key | IN($names[]) | not))' \
            range.json > new.json
          echo "new puzzles: $(jq length new.json)"
      - name: Write new puzzles
        run: |
          count=$(jq length new.json)
          if [[ "$count" -gt 0 ]]; then
            npx wrangler kv bulk put --namespace-id "$KV_NAMESPACE" --remote new.json
          fi
          echo "wrote $count puzzles"
