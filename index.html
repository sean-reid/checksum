<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>checksum</title>
    <meta
      name="description"
      content="A daily word puzzle. Find the phrase that fits every rule, then read off its checksum."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/newsreader-24pt.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1 class="wordmark">checksum</h1>
        <p class="meta" id="meta"></p>
        <nav class="tools" aria-label="Page">
          <button
            type="button"
            class="link"
            id="stats-toggle"
            aria-expanded="false"
            aria-controls="stats"
          >
            stats
          </button>
          <button type="button" class="link" id="theme-toggle"></button>
        </nav>
      </header>
      <section id="stats" class="stats" hidden></section>
      <p id="notice" class="notice" role="status"></p>
      <main id="main"></main>
      <footer class="colophon">
        <a href="https://github.com/sean-reid/checksum">Source</a>
        <a href="https://en.wikipedia.org/wiki/Scrabble_letter_distributions"
          >Scrabble tile values</a
        >
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
